provider: aws
display: Amazon Web Services
verified: true
sources:
  - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/
  - https://ip-ranges.amazonaws.com/ip-ranges.json
signals:
  - type: header
    match: x-amz-cf-id
    pattern: .+
    weight: 10
    verified: true
    source: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/RequestAndResponseBehaviorCustomOrigin.html
  - type: header
    match: x-amz-cf-pop
    pattern: ^[A-Z]{3}[0-9]+(-[A-Z][0-9]+)?$
    weight: 10
    verified: true
    source: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/RequestAndResponseBehaviorCustomOrigin.html
  - type: header
    match: via
    pattern: 1\.1 [0-9a-f]+\.cloudfront\.net \(CloudFront\)
    weight: 10
    verified: true
    source: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/RequestAndResponseBehaviorCustomOrigin.html
  - type: header
    match: x-cache
    pattern: from cloudfront$
    weight: 10
    verified: true
    source: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/HTTPCacheableBehaviors.html
  - type: header
    match: Server
    pattern: ^CloudFront$
    weight: 10
    verified: true
    source: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/
  - type: cname
    pattern: \.cloudfront\.net$
    weight: 25
    verified: true
    source: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/CNAMEs.html
    negative:
      - cloudfront.net
  - type: header
    match: Server
    pattern: ^AmazonS3$
    weight: 10
    verified: true
    source: https://docs.aws.amazon.com/AmazonS3/latest/API/RESTObjectGET.html
  - type: header
    match: x-amz-server-side-encryption
    pattern: ^AES256$
    weight: 10
    verified: true
    source: https://docs.aws.amazon.com/AmazonS3/latest/userguide/UsingServerSideEncryption.html
  - type: cname
    pattern: \.s3-website-[a-z0-9-]+\.amazonaws\.com$
    weight: 25
    source: https://docs.aws.amazon.com/AmazonS3/latest/userguide/WebsiteHosting.html
  - type: header
    match: x-amzn-RequestId
    pattern: .+
    weight: 10
    source: https://docs.aws.amazon.com/apigateway/latest/developerguide/
  - type: cname
    pattern: \.execute-api\.[a-z0-9-]+\.amazonaws\.com$
    weight: 25
    source: https://docs.aws.amazon.com/apigateway/latest/developerguide/
  - type: header
    match: Server
    pattern: ^awselb$
    weight: 10
    source: https://docs.aws.amazon.com/elasticloadbalancing/latest/classic/
  - type: cname
    pattern: \.elb\.amazonaws\.com$
    weight: 25
    note: internal- prefix hostnames (internal-*.{region}.elb.amazonaws.com) indicate an internal LB, likely a CloudFront VPC origin — see provider-signatures.md
    source: https://docs.aws.amazon.com/elasticloadbalancing/latest/classic/
  - type: cname
    pattern: ^internal-[a-z0-9-]+\.[a-z0-9-]+\.elb\.amazonaws\.com$
    weight: 25
    note: leaked internal-LB hostname = strong VPC-origin hint; region slug decodes as compute signal
    source: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-vpc-origins.html
  - type: cert
    pattern: Amazon RSA 2048 M
    weight: 25
    verified: true
    source: https://docs.aws.amazon.com/acm/latest/userguide/
  - type: asn
    values:
      - AS16509
    weight: 35
    source: https://ip-ranges.amazonaws.com/ip-ranges.json
