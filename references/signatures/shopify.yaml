provider: shopify
display: Shopify
verified: true
sources:
  - https://shopify.dev/docs/
signals:
  - type: header
    match: x-shopid
    pattern: ^[0-9]+$
    weight: 10
    source: https://shopify.dev/docs/
  - type: header
    match: x-shopify-stage
    pattern: .+
    weight: 10
    source: https://shopify.dev/docs/
  - type: header
    match: Server
    pattern: ^cloudflare$
    weight: 10
    verified: true
    source: https://shopify.dev/docs/
  - type: cname
    pattern: \.myshopify\.com$
    weight: 25
    source: https://shopify.dev/docs/
