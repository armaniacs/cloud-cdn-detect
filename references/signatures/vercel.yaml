provider: vercel
display: Vercel
verified: true
sources:
  - https://vercel.com/docs/
signals:
  - type: header
    match: Server
    pattern: ^Vercel$
    weight: 10
    verified: true
    source: https://vercel.com/docs/
  - type: header
    match: x-vercel-id
    pattern: ^[a-z]{3}1?::[a-z0-9-]+$
    weight: 10
    verified: true
    source: https://vercel.com/docs/
  - type: header
    match: x-vercel-cache
    pattern: ^(HIT|MISS|STALE)$
    weight: 10
    verified: true
    source: https://vercel.com/docs/
  - type: cname
    pattern: (^|.)cname\.vercel-dns\.com$
    weight: 25
    source: https://vercel.com/docs/
  - type: cname
    pattern: \.vercel\.app$
    weight: 25
    source: https://vercel.com/docs/
  - type: cidr
    value: 76.76.21.21/32
    weight: 35
    source: https://vercel.com/docs/
