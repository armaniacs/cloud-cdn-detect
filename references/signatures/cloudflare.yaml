provider: cloudflare
display: Cloudflare
verified: true
sources:
  - https://www.cloudflare.com/ips-v4
  - https://developers.cloudflare.com/
signals:
  - type: header
    match: Server
    pattern: ^cloudflare$
    weight: 10
    verified: true
    source: https://developers.cloudflare.com/
  - type: header
    match: cf-ray
    pattern: ^[0-9a-f]+-[A-Z]{3}$
    weight: 10
    verified: true
    source: https://developers.cloudflare.com/fundamentals/
  - type: header
    match: cf-cache-status
    pattern: ^(HIT|MISS|DYNAMIC|BYPASS|EXPIRED)$
    weight: 10
    source: https://developers.cloudflare.com/cache/
  - type: header
    match: cf-mitigated
    pattern: ^(challenge|blocked)$
    weight: 10
    source: https://developers.cloudflare.com/waf/
  - type: cname
    pattern: \.cloudflare\.net$
    weight: 25
    source: https://developers.cloudflare.com/dns/
  - type: cname
    pattern: \.cdn\.cloudflare\.net$
    weight: 25
    source: CT log observation (crt.sh, 2026-11-08, 4k+ certs)
    negative:
      - cdncloudflare.net
  - type: cidr
    ref: https://www.cloudflare.com/ips-v4
    weight: 35
    source: https://www.cloudflare.com/ips-v4
  - type: cidr
    ref: https://www.cloudflare.com/ips-v6
    weight: 35
    source: https://www.cloudflare.com/ips-v6
  - type: asn
    values:
      - AS13335
    weight: 35
    source: https://www.cloudflare.com/ips-v4
