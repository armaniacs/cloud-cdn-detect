provider: akamai
display: Akamai
verified: true
sources:
  - https://techdocs.akamai.com/
  - https://github.com/projectdiscovery/cdncheck/blob/main/cmd/generate-index/provider.yaml
signals:
  - type: header
    match: Server
    pattern: ^AkamaiGHost$
    weight: 10
    verified: true
    source: https://techdocs.akamai.com/
  - type: header
    match: X-Akamai-Transformed
    pattern: .+
    weight: 10
    source: https://techdocs.akamai.com/
  - type: header
    match: X-Check-Cacheable
    pattern: .+
    weight: 10
    source: https://techdocs.akamai.com/
  - type: cname
    pattern: \.akamaiedge\.net$
    weight: 25
    source: https://techdocs.akamai.com/
    negative:
      - akamai.net
  - type: cname
    pattern: \.edgekey\.net$
    weight: 25
    source: https://techdocs.akamai.com/
  - type: cname
    pattern: \.edgesuite\.net$
    weight: 25
    source: https://techdocs.akamai.com/
  - type: cname
    pattern: \.akamaized\.net$
    weight: 25
    source: https://techdocs.akamai.com/
  - type: cname
    pattern: \.akadns\.net$
    weight: 25
    source: https://techdocs.akamai.com/
  - type: asn
    values:
      - AS20940
      - AS16625
    weight: 35
    source: https://github.com/projectdiscovery/cdncheck/blob/main/cmd/generate-index/provider.yaml
