provider: wix
display: Wix
verified: true
sources:
  - https://dev.wix.com/
signals:
  - type: header
    match: x-wix-request-id
    pattern: .+
    weight: 10
    verified: true
    source: https://dev.wix.com/
  - type: header
    match: Server
    pattern: ^Pepyaka$
    weight: 10
    verified: true
    source: https://dev.wix.com/
  - type: header
    match: via
    pattern: ^1\.1 google$
    weight: 10
    verified: true
    source: https://dev.wix.com/
  - type: header
    match: server-timing
    pattern: fastly_g
    weight: 10
    verified: true
    source: https://dev.wix.com/
