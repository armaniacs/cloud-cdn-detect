provider: heroku
display: Heroku
verified: false
sources:
  - https://devcenter.heroku.com/
signals:
  - type: header
    match: via
    pattern: ^1\.1 vegur$
    weight: 10
    source: https://devcenter.heroku.com/
    negative:
      - 1.1 vegur-proxy
  - type: cname
    pattern: \.herokuapp\.com$
    weight: 25
    source: https://devcenter.heroku.com/
  - type: cname
    pattern: \.herokudns\.com$
    weight: 25
    source: https://devcenter.heroku.com/
