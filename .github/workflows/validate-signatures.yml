name: validate-signatures

on:
  pull_request:
    paths:
      - references/signatures/**
      - tools/validate-signatures.py
  push:
    branches: [main]
    paths:
      - references/signatures/**
      - tools/validate-signatures.py

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python tools/validate-signatures.py
