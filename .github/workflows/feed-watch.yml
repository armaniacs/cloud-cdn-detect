name: feed-watch

on:
  schedule:
    # Monday 00:00 UTC (09:00 JST), weekly
    - cron: "0 0 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - tools/feeds.yaml
      - tools/check-feeds.py
      - .github/workflows/feed-watch.yml

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: check feeds
        id: check
        run: python tools/check-feeds.py 2>&1 | tee feed-check.log; exit ${PIPESTATUS[0]}
      - name: file or update tracking issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="[feed-watch] feed check failed"
          body="$(printf 'Feed watch failed on %s.\n\n```\n%s\n```\n\nRun: %s' "$(date -u +%F)" "$(cat feed-check.log)" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
          existing=$(gh issue list --label feed-watch --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label feed-watch --body "$body"
          fi
